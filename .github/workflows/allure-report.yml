name: Publish Allure Report

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # SLACK_WEBHOOK_URL: GitHub → repo marketplace-allure-reports → Settings → Secrets and variables → Actions (не в git).
      - name: Notify Slack
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skip Slack notify"
            exit 0
          fi
          DATE=$(date -u +'%Y-%m-%d')
          REPORT_URL="${{ steps.deploy.outputs.page_url }}"
          if [ -z "$REPORT_URL" ]; then
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$(printf '%s' "{\"text\":\"✅ Marketplace Allure report — ${DATE}\\n${REPORT_URL}\"}")"

# Публикует Allure HTML на GitHub Pages из каталога allure-results/ в этом репозитории.
# Источник результатов: прогон Playwright в monorepo marketplace → скрипт копирует e2e/allure-results сюда → push → этот workflow.

name: Publish Allure Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'allure-results/**'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Allure Report
        run: npx -y allure-commandline@2.40.0 generate allure-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # SLACK_WEBHOOK_URL → Settings → Secrets and variables → Actions (этого репозитория)
      - name: Notify Slack
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL not set; skip Slack notify"
            exit 0
          fi
          DATE=$(date -u +'%Y-%m-%d')
          REPORT_URL="${{ steps.deployment.outputs.page_url }}"
          if [ -z "$REPORT_URL" ]; then
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "$(printf '%s' "{\"text\":\"✅ Marketplace Allure report — ${DATE}\\n${REPORT_URL}\"}")"
